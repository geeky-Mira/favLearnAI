version: '3.9'

services:
  backend:
    build: ./backend
    container_name: favlearn_backend
    ports:
      - "8001:8001"
    env_file:
      - backend/.env
    restart: always

  frontend:
    build: ./frontend
    container_name: favlearn_frontend
    ports:
      - "8080:80"
    restart: always
